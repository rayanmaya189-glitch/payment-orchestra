syntax = "proto3";
package compliance;

service ComplianceService {
  rpc SubmitKybEvidence(SubmitKybEvidenceRequest) returns (SubmitKybEvidenceResponse);
  rpc ReviewKybCase(ReviewKybCaseRequest) returns (ReviewKybCaseResponse);
  rpc GetAmlAlerts(GetAmlAlertsRequest) returns (GetAmlAlertsResponse);
  rpc GenerateSar(GenerateSarRequest) returns (GenerateSarResponse);
}

message SubmitKybEvidenceRequest {
  string operator_id = 1;
  repeated string document_ids = 2;
}

message SubmitKybEvidenceResponse {
  string kyb_case_id = 1;
  string status = 2;
}

message ReviewKybCaseRequest {
  string kyb_case_id = 1;
  string decision = 2;
  string reason = 3;
}

message ReviewKybCaseResponse {
  string status = 1;
}

message GetAmlAlertsRequest {
  string operator_id = 1;
}

message GetAmlAlertsResponse {
  repeated AmlAlert alerts = 1;
}

message AmlAlert {
  string alert_id = 1;
  string alert_type = 2;
  string severity = 3;
  string status = 4;
  string created_at = 5;
}

message GenerateSarRequest {
  string alert_id = 1;
}

message GenerateSarResponse {
  string report_id = 1;
  string status = 2;
}
