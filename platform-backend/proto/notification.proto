syntax = "proto3";
package notification;

import "common.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  rpc GetNotification(GetNotificationRequest) returns (NotificationView);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
}

message SendNotificationRequest {
  string notification_type = 1;
  string recipient = 2;
  string subject = 3;
  string body = 4;
  map<string, string> metadata = 5;
}

message SendNotificationResponse {
  string notification_id = 1;
  string status = 2;
}

message GetNotificationRequest {
  string notification_id = 1;
}

message NotificationView {
  string notification_id = 1;
  string status = 2;
  string notification_type = 3;
  string recipient = 4;
  string subject = 5;
  string body = 6;
  string created_at = 7;
  string sent_at = 8;
}

message ListNotificationsRequest {
  string operator_id = 1;
  string notification_type = 2;
  string status = 3;
  string cursor = 4;
  uint32 limit = 5;
}

message ListNotificationsResponse {
  repeated NotificationView notifications = 1;
  string next_cursor = 2;
  bool has_more = 3;
}
