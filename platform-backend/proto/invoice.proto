syntax = "proto3";
package invoice;

import "common.proto";

service InvoiceService {
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (InvoiceView);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc SendInvoice(SendInvoiceRequest) returns (SendInvoiceResponse);
  rpc CancelInvoice(CancelInvoiceRequest) returns (CancelInvoiceResponse);
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
}

message CreateInvoiceRequest {
  string order_reference = 1;
  repeated InvoiceLineItem line_items = 2;
  string due_date = 3;
  string recipient_email = 4;
}

message InvoiceLineItem {
  string description = 1;
  int64 amount_minor_units = 2;
  int32 quantity = 3;
}

message CreateInvoiceResponse {
  string invoice_id = 1;
  string status = 2;
  Money total_amount = 3;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message InvoiceView {
  string invoice_id = 1;
  string order_reference = 2;
  string status = 3;
  Money total_amount = 4;
  Money paid_amount = 5;
  string currency = 6;
  string due_date = 7;
  string recipient_email = 8;
  repeated string payment_intent_ids = 9;
  string created_at = 10;
}

message ListInvoicesRequest {
  string operator_id = 1;
  string status = 2;
  string cursor = 3;
  uint32 limit = 4;
}

message ListInvoicesResponse {
  repeated InvoiceView invoices = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SendInvoiceRequest {
  string invoice_id = 1;
}

message SendInvoiceResponse {
  string status = 1;
}

message CancelInvoiceRequest {
  string invoice_id = 1;
  string reason = 2;
}

message CancelInvoiceResponse {
  string status = 1;
}

message RecordPaymentRequest {
  string invoice_id = 1;
  string payment_intent_id = 2;
  int64 amount_minor_units = 3;
}

message RecordPaymentResponse {
  string status = 1;
  Money paid_amount = 2;
}

message Money {
  int64 amount_minor_units = 1;
  string currency_code = 2;
}

message PaginationResponse {
  string next_cursor = 1;
  bool has_more = 2;
}
