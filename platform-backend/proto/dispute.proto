syntax = "proto3";
package dispute;

import "common.proto";

service DisputeService {
  rpc OpenDispute(OpenDisputeRequest) returns (OpenDisputeResponse);
  rpc GetDispute(GetDisputeRequest) returns (DisputeView);
  rpc ListDisputes(ListDisputesRequest) returns (ListDisputesResponse);
  rpc SubmitEvidence(SubmitEvidenceRequest) returns (SubmitEvidenceResponse);
  rpc ResolveDispute(ResolveDisputeRequest) returns (ResolveDisputeResponse);
}

message OpenDisputeRequest {
  string payment_intent_id = 1;
  string reason = 2;
  Money amount = 3;
  string currency = 4;
}

message OpenDisputeResponse {
  string dispute_id = 1;
  string status = 2;
}

message GetDisputeRequest {
  string dispute_id = 1;
}

message DisputeView {
  string dispute_id = 1;
  string status = 2;
  string reason = 3;
  Money amount = 4;
  string currency = 5;
  string evidence = 6;
  string created_at = 7;
  string resolved_at = 8;
}

message ListDisputesRequest {
  string operator_id = 1;
  string status = 2;
  string cursor = 3;
  uint32 limit = 4;
}

message ListDisputesResponse {
  repeated DisputeView disputes = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SubmitEvidenceRequest {
  string dispute_id = 1;
  string evidence = 2;
}

message SubmitEvidenceResponse {
  string status = 1;
}

message ResolveDisputeRequest {
  string dispute_id = 1;
  string resolution = 2;
}

message ResolveDisputeResponse {
  string status = 1;
}

message Money {
  int64 amount_minor_units = 1;
  string currency_code = 2;
}

message PaginationResponse {
  string next_cursor = 1;
  bool has_more = 2;
}
