syntax = "proto3";
package ai_assistant;

import "common.proto";

service AiAssistantService {
  rpc AskAssistant(AskAssistantRequest) returns (AskAssistantResponse);
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
}

message AskAssistantRequest {
  string session_id = 1;
  string query = 2;
  bool has_image = 3;
  bytes image_data = 4;
}

message AskAssistantResponse {
  string query_id = 1;
  string answer = 2;
  repeated Citation citations = 3;
  double confidence = 4;
  string model_used = 5;
  uint32 latency_ms = 6;
}

message Citation {
  string source_type = 1;
  string source_id = 2;
  string text_snippet = 3;
  double relevance_score = 4;
}

message GetSessionHistoryRequest {
  string session_id = 1;
}

message GetSessionHistoryResponse {
  repeated QueryHistory queries = 1;
}

message QueryHistory {
  string query_id = 1;
  string query = 2;
  string answer = 3;
  string created_at = 4;
}

message CreateSessionRequest {
  string operator_id = 1;
}

message CreateSessionResponse {
  string session_id = 1;
  string created_at = 2;
}
