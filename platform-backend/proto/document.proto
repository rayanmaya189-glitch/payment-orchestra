syntax = "proto3";
package document;

import "common.proto";

service DocumentService {
  rpc UploadDocument(UploadDocumentRequest) returns (UploadDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (DocumentView);
  rpc GetDocumentUrl(GetDocumentUrlRequest) returns (GetDocumentUrlResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}

message UploadDocumentRequest {
  string operator_id = 1;
  string document_type = 2;
  string filename = 3;
  string content_type = 4;
  bytes file_content = 5;
}

message UploadDocumentResponse {
  string document_id = 1;
  string status = 2;
  string storage_key = 3;
}

message GetDocumentRequest {
  string document_id = 1;
}

message DocumentView {
  string document_id = 1;
  string operator_id = 2;
  string document_type = 3;
  string filename = 4;
  string content_type = 5;
  int64 file_size_bytes = 6;
  string storage_key = 7;
  string checksum_sha256 = 8;
  string status = 9;
  string uploaded_by = 10;
  string created_at = 11;
}

message GetDocumentUrlRequest {
  string document_id = 1;
  int32 expires_in_seconds = 2;
}

message GetDocumentUrlResponse {
  string url = 1;
  string expires_at = 2;
}

message ListDocumentsRequest {
  string operator_id = 1;
  string document_type = 2;
  string cursor = 3;
  uint32 limit = 4;
}

message ListDocumentsResponse {
  repeated DocumentView documents = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message DeleteDocumentRequest {
  string document_id = 1;
}

message DeleteDocumentResponse {
  string status = 1;
}
