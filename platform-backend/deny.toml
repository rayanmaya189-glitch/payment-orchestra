# cargo-deny configuration — supply chain security (SRS SUPPLY-001, SUPPLY-002)
# Run: cargo deny check

[advisories]
# Use RustSec advisory database
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

[licenses]
# Only allow permissive licenses for a proprietary payment platform
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "0BSD",
]
copyleft = "deny"

[bans]
# Detect multiple versions of the same crate
multiple-versions = "warn"
highlight = "all"

# Deny specific crates that are known problematic
deny = [
    # No unsafe CRATE usage in a payment platform
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
