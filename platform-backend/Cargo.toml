[workspace]
resolver = "2"
members = [
    "crates/*",
    "services/*",
    "migrations",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = "1"

# Messaging
async-nats = "0.39"

# Caching / State
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Error handling
thiserror = "2"
anyhow = "1"

# IDs
uuid = { version = "1", features = ["v7", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"
dotenvy = "0.15"

# Tracing / Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# Crypto
argon2 = "0.5"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"

# Validation
validator = { version = "0.19", features = ["derive"] }

# OpenAPI / Swagger
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# HTTP
http = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# IP parsing
ipnet = "2"

# Async traits
async-trait = "0.1"

# JWT
jsonwebtoken = "9"

# Internal crates
platform-error = { path = "crates/platform-error" }
shared-types = { path = "crates/shared-types" }
platform-logging = { path = "crates/platform-logging" }
platform-config = { path = "crates/platform-config" }
platform-db = { path = "crates/platform-db" }
platform-middleware = { path = "crates/platform-middleware" }
platform-messaging = { path = "crates/platform-messaging" }
platform-proto = { path = "crates/platform-proto" }
platform-api = { path = "crates/platform-api" }

# sqlx removed — SeaORM uses its own sqlx-postgres adapter internally

[profile.release]
lto = true
codegen-units = 1
strip = true
