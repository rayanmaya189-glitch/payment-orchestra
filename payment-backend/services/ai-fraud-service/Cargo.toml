[package]
name = "ai-fraud-service"
version = "0.1.0"
edition = "2021"
description = "AI-powered fraud detection service for Payment Orchestra"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# gRPC
tonic = "0.12"
prost = "0.13"

# Web
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"

# Internal crates
platform-config = { path = "../../crates/platform-config" }
platform-health = { path = "../../crates/platform-health" }
platform-metrics = { path = "../../crates/platform-metrics" }

[build-dependencies]
tonic-build = "0.12"

[features]
default = ["integration_test"]
integration_test = []
