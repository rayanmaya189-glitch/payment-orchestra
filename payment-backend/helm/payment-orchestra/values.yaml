# ─── Frontend ───────────────────────────────────────────────────────────────

frontend:
  replicas: 2
  port: 80
  service:
    type: ClusterIP

# ─── Ingress ────────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.payment-orchestra.com
      paths:
        - path: /api
          pathType: Prefix
          serviceName: api-gateway
          servicePort: 9020
    - host: dashboard.payment-orchestra.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 80
  tls:
    - secretName: payment-orchestra-tls
      hosts:
        - api.payment-orchestra.com
        - dashboard.payment-orchestra.com

# ─── Monitoring ─────────────────────────────────────────────────────────────

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRules:
    enabled: true

# ─── Pod Disruption Budgets ─────────────────────────────────────────────────

pdb:
  enabled: true
  minAvailable: 1

# ─── Security ───────────────────────────────────────────────────────────────

security:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
