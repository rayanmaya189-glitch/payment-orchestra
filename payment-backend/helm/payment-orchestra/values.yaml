# Payment Orchestra — Helm values (defaults for dev/staging/prod overrides)

global:
  imageRegistry: ghcr.io/payment-orchestra
  imageTag: latest
  environment: dev
  # Override per environment:
  #   --set global.environment=staging
  #   --set global.imageTag=v1.2.3

# ─── Infrastructure Services ────────────────────────────────────────────────

infrastructure:
  postgres:
    host: postgresql
    port: 5432
    database: payment_orchestra
    # Secrets via ExternalSecrets or sealed-secrets in prod
    secretName: payment-orchestra-db-credentials

  redis:
    host: redis-master
    port: 6379
    secretName: payment-orchestra-redis-credentials

  nats:
    url: nats://nats:4222
    cluster: payment-nats

  minio:
    endpoint: minio:9000
    bucket: payment-documents
    secretName: payment-orchestra-minio-credentials

  ollama:
    endpoint: http://ollama:11434
    model: qwen3

