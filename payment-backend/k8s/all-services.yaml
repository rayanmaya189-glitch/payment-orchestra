# =============================================================================
# Payment Orchestra — K8s Manifests for All Services
# =============================================================================
# This file contains Deployment, Service, ServiceAccount, HPA, and PDB
# for every backend service. Apply with: kubectl apply -f k8s/all-services.yaml
# =============================================================================

# ─── Helper: Each service follows the same pattern ───────────────────────────
# Services: iam, compliance, connector-gateway, invoice, payment-link,
# subscription, reconciliation, dispute, risk, ai-assistant, document,
# notification, analytics, saga-coordinator, scheduler, merchant-acquirer-link,
# outbox-relay, ai-gateway, merchant-connector-onboarding, ai-fraud, saas-billing
# =============================================================================

# --- IAM Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-service
  namespace: payment-orchestra
  labels:
    app: iam-service
    app.kubernetes.io/name: iam-service
    app.kubernetes.io/part-of: payment-orchestration-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iam-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: iam-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: iam-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: iam-service
        image: payment-orchestra/iam-service:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 9002
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info,iam_service=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: redis-url
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: nats-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          grpc:
            port: 9002
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 9002
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: iam-service
  namespace: payment-orchestra
  labels:
    app: iam-service
spec:
  selector:
    app: iam-service
  ports:
  - name: grpc
    port: 9002
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-service
  namespace: payment-orchestra
  labels:
    app: iam-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iam-service
  namespace: payment-orchestra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iam-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iam-service
  namespace: payment-orchestra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: iam-service
---
