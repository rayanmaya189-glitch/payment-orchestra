apiVersion: v1
kind: Namespace
metadata:
  name: payment-orchestra
  labels:
    app.kubernetes.io/part-of: payment-orchestration-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestration-service
  namespace: payment-orchestra
  labels:
    app: orchestration-service
    app.kubernetes.io/name: orchestration-service
    app.kubernetes.io/part-of: payment-orchestration-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: orchestration-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: orchestration-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: orchestration-service
        image: payment-orchestra/orchestration-service:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info,payment_orchestration=debug"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: redis-url
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: nats-url
        - name: VAULT_ADDR
          valueFrom:
            configMapKeyRef:
              name: payment-orchestra-config
              key: vault-addr
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: payment-orchestra-secrets
              key: vault-token
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-service
  namespace: payment-orchestra
  labels:
    app: orchestration-service
spec:
  selector:
    app: orchestration-service
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestration-service
  namespace: payment-orchestra
  labels:
    app: orchestration-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestration-service
  namespace: payment-orchestra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orchestration-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orchestration-service
  namespace: payment-orchestra
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: orchestration-service
