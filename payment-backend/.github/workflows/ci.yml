# CI/CD Pipeline for Payment Orchestra
#
# Runs on every push and pull request to main/dev-v2 branches:
# 1. cargo check — fast compilation check
# 2. cargo test — unit test suite (~260+ tests)
# 3. cargo build (release) — optimized production binary
# 4. Docker build — multi-stage image for deployment

name: CI/CD

on:
  push:
    branches: [main, dev-v2]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.85"

jobs:
  # ─── Job 1: Code Quality (fastest feedback) ──────────────────────────────
  check:
    name: cargo check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}
          rustup component add clippy rustfmt

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-cargo-check-

      - name: Install protoc (required for tonic/prost builds)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: cargo check
        working-directory: ./payment-backend
        run: cargo check --workspace

      - name: cargo fmt check
        working-directory: ./payment-backend
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: ./payment-backend
        run: cargo clippy --workspace

  # ─── Job 2: Tests ────────────────────────────────────────────────────────
  test:
    name: cargo test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-cargo-test-
            v1-cargo-check-

      - name: Install protoc and dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: cargo test
        working-directory: ./payment-backend
        run: cargo test --workspace

  # ─── Job 3: Release Build ─────────────────────────────────────────────────
  build:
    name: cargo build (release)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v1-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-cargo-release-
            v1-cargo-test-
            v1-cargo-check-

      - name: Install protoc and dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: cargo build (release)
        working-directory: ./payment-backend
        run: cargo build --release --workspace

      - name: Strip debug symbols from binaries
        working-directory: ./payment-backend
        run: |
          find target/release -maxdepth 1 -type f -executable | while read bin; do
            strip "$bin" || true
          done

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: ./payment-backend/target/release/
          retention-days: 7

  # ─── Job 4: Docker Image ──────────────────────────────────────────────────
  docker:
    name: Docker build and push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/payment-orchestra
          tags: |
            type=ref,event=branch
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./payment-backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
