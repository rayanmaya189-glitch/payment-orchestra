// orchestration.proto — Payment Orchestration Core (BC-05)
// AI-Native Payment Orchestration Platform
// Event-sourced aggregate for PaymentIntent lifecycle, routing, failover

syntax = "proto3";
package orchestration.v1;

import "common.proto";

// ─── Service ────────────────────────────────────────────────────────────────

service OrchestrationService {
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (CreatePaymentIntentResponse);
  rpc AuthorizePaymentIntent(AuthorizePaymentIntentRequest) returns (AuthorizePaymentIntentResponse);
  rpc CapturePaymentIntent(CapturePaymentIntentRequest) returns (CapturePaymentIntentResponse);
  rpc VoidPaymentIntent(VoidPaymentIntentRequest) returns (VoidPaymentIntentResponse);
  rpc RefundPaymentIntent(RefundPaymentIntentRequest) returns (RefundPaymentIntentResponse);
  rpc GetPaymentIntent(GetPaymentIntentRequest) returns (PaymentIntentView);
  rpc ActivateRoutingPolicy(ActivateRoutingPolicyRequest) returns (ActivateRoutingPolicyResponse);
  rpc GetRoutingPolicy(GetRoutingPolicyRequest) returns (RoutingPolicyView);
}

// ─── Payment Intent Messages ────────────────────────────────────────────────

message CreatePaymentIntentRequest {
  common.v1.Money amount = 1;
  string idempotency_key = 2;
  string purpose = 3;           // 'payment' | 'card_verification'
  string metadata_json = 4;
  string operator_id = 5;
  string source_type = 6;        // 'merchant_api' | 'invoice' | 'subscription' | 'payment_link'
}

message CreatePaymentIntentResponse {
  string payment_intent_id = 1;
  string status = 2;              // 'created'
  common.v1.Timestamp created_at = 3;
}

message AuthorizePaymentIntentRequest {
  string payment_intent_id = 1;
  string payment_method_token_id = 2;
}

message AuthorizePaymentIntentResponse {
  string status = 1;              // 'authorized' | 'failed'
  repeated RoutingAttemptResult attempts = 2;
  string final_decline_reason = 3;
}

message RoutingAttemptResult {
  string acquirer_connector_id = 1;
  bool approved = 2;
  string normalized_decline_reason = 3;
  uint32 latency_ms = 4;
  string acquirer_reference = 5;
}

message CapturePaymentIntentRequest {
  string payment_intent_id = 1;
  common.v1.Money amount = 2;    // optional, null = full capture
  string idempotency_key = 3;
}

message CapturePaymentIntentResponse {
  string status = 1;              // 'captured' | 'partially_captured'
  common.v1.Money captured_amount = 2;
}

message VoidPaymentIntentRequest {
  string payment_intent_id = 1;
  string reason = 2;
}

message VoidPaymentIntentResponse {
  string status = 1;              // 'voided'
}

message RefundPaymentIntentRequest {
  string payment_intent_id = 1;
  common.v1.Money amount = 2;    // optional, null = full refund
  string reason = 3;
}

message RefundPaymentIntentResponse {
  string status = 1;              // 'refunded' | 'partially_refunded'
  string refund_id = 2;
  common.v1.Money refunded_amount = 3;
}

message GetPaymentIntentRequest {
  string payment_intent_id = 1;
}

message PaymentIntentView {
  string payment_intent_id = 1;
  string operator_id = 2;
  string status = 3;
  common.v1.Money requested_amount = 4;
  common.v1.Money authorized_amount = 5;
  common.v1.Money captured_amount = 6;
  common.v1.Money refunded_amount = 7;
  string currency = 8;
  common.v1.Timestamp created_at = 9;
  common.v1.Timestamp updated_at = 10;
  string source_type = 11;
  string source_id = 12;
}

// ─── Routing Policy Messages ────────────────────────────────────────────────

message ActivateRoutingPolicyRequest {
  repeated RoutingRule rules = 1;
  FailoverConfig failover_config = 2;
  string operator_id = 3;
}

message RoutingRule {
  string acquirer_link_id = 1;
  uint32 priority = 2;
  string condition_json = 3;     // RoutingCondition serialized as JSON
  string rotation_strategy = 4;  // 'priority' | 'round_robin' | 'weighted'
}

message FailoverConfig {
  repeated string retryable_decline_codes = 1;
  uint32 max_hops = 2;
  uint32 latency_budget_ms = 3;
  bool retry_unknown_as_fallback = 4;
}

message ActivateRoutingPolicyResponse {
  string routing_policy_id = 1;
  int32 version = 2;
  string status = 3;              // 'active'
}

message GetRoutingPolicyRequest {
  string policy_id = 1;
}

message RoutingPolicyView {
  string policy_id = 1;
  string operator_id = 2;
  repeated RoutingRule rules = 3;
  FailoverConfig failover_config = 4;
  int32 version = 5;
  string status = 6;
  common.v1.Timestamp created_at = 7;
}

// ─── Domain Events ──────────────────────────────────────────────────────────

message PaymentIntentCreatedEvent {
  string payment_intent_id = 1;
  string operator_id = 2;
  common.v1.Money amount = 3;
  string purpose = 4;
  string source_type = 5;
  int64 occurred_at_unix_ms = 6;
}

message PaymentIntentAuthorizedEvent {
  string payment_intent_id = 1;
  bool success = 2;
  string acquirer_connector_id = 3;
  int64 occurred_at_unix_ms = 4;
}

message PaymentIntentCapturedEvent {
  string payment_intent_id = 1;
  common.v1.Money captured_amount = 2;
  bool is_partial = 3;
  int64 occurred_at_unix_ms = 4;
}

message PaymentIntentVoidedEvent {
  string payment_intent_id = 1;
  string reason = 2;
  int64 occurred_at_unix_ms = 3;
}

message PaymentIntentRefundedEvent {
  string payment_intent_id = 1;
  common.v1.Money refunded_amount = 2;
  bool is_partial = 3;
  int64 occurred_at_unix_ms = 4;
}

message PaymentIntentFailedEvent {
  string payment_intent_id = 1;
  string decline_reason = 2;
  int32 attempt_count = 3;
  string last_acquirer = 4;
  int64 occurred_at_unix_ms = 5;
}

message PaymentIntentFailedAllRoutesEvent {
  string payment_intent_id = 1;
  repeated string attempted_connectors = 2;
  int64 occurred_at_unix_ms = 3;
}

message RoutingPolicyActivatedEvent {
  string policy_id = 1;
  string operator_id = 2;
  int32 version = 3;
  int64 occurred_at_unix_ms = 4;
}
