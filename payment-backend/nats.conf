# NATS Server Configuration — Per-Service Authentication
# Each microservice connects with its own credentials.
# Generated for Payment Orchestra platform.

port: 4222
jetstream: enabled
store_dir: "/data"

authorization: {
  # Default permissions (no default user)
  # Each service has its own user entry with specific permissions
  
  users: [
    # ── Event-Sourced Core Services ──────────────────────────────────
    {user: "operator_svc",     password: "operator_svc_pass"}
    {user: "iam_svc",          password: "iam_svc_pass"}
    {user: "compliance_svc",   password: "compliance_svc_pass"}
    {user: "orchestration_svc", password: "orchestration_svc_pass"}
    {user: "invoice_svc",      password: "invoice_svc_pass"}
    {user: "subscription_svc", password: "subscription_svc_pass"}
    {user: "dispute_svc",      password: "dispute_svc_pass"}
    {user: "reconciliation_svc", password: "reconciliation_svc_pass"}
    
    # ── CRUD & Gateway Services ─────────────────────────────────────
    {user: "connector_gateway_svc",  password: "connector_gateway_svc_pass"}
    {user: "merchant_acquirer_link_svc", password: "merchant_acquirer_link_svc_pass"}
    {user: "merchant_connector_onboarding_svc", password: "merchant_connector_onboarding_svc_pass"}
    {user: "payment_link_svc", password: "payment_link_svc_pass"}
    {user: "risk_svc",         password: "risk_svc_pass"}
    {user: "notification_svc", password: "notification_svc_pass"}
    {user: "document_svc",     password: "document_svc_pass"}
    {user: "analytics_svc",    password: "analytics_svc_pass"}
    
    # ── AI & Infrastructure Services ────────────────────────────────
    {user: "ai_assistant_svc",           password: "ai_assistant_svc_pass"}
    {user: "ai_gateway_svc",            password: "ai_gateway_svc_pass"}
    {user: "api_gateway_svc",           password: "api_gateway_svc_pass"}
    {user: "saga_coordinator_svc",      password: "saga_coordinator_svc_pass"}
    {user: "scheduler_svc",             password: "scheduler_svc_pass"}
    {user: "outbox_relay_svc",          password: "outbox_relay_svc_pass"}
  ]
}
