; =============================================================================
; PgBouncer Connection Pooling Configuration for Payment Orchestration Platform
; =============================================================================
; This file configures PgBouncer for optimal connection pooling.

[databases]
; Main payment database
payment_orchestra = host=localhost port=5432 dbname=payment_orchestra

; Read replica for analytics queries (if available)
; payment_orchestra_replica = host=replica-host port=5432 dbname=payment_orchestra

[pgbouncer]

; ─── Connection Settings ─────────────────────────────────────────────────────
; Listen address and port
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ─── Pool Settings ───────────────────────────────────────────────────────────
; Pool mode: transaction (recommended for most workloads)
pool_mode = transaction

; Maximum client connections
max_client_conn = 1000

; Default pool size (connections per user/database pair)
default_pool_size = 25

; Minimum pool size (always keep these connections open)
min_pool_size = 5

; Maximum pool size (absolute maximum)
max_pool_size = 50

; Reserve pool size (extra connections for burst traffic)
reserve_pool_size = 10

; Reserve pool timeout (seconds before using reserve pool)
reserve_pool_timeout = 3

; ─── Connection Lifecycle ────────────────────────────────────────────────────
; Server idle timeout (seconds)
server_idle_timeout = 300

; Server lifetime (seconds) - rotate connections periodically
server_lifetime = 3600

; Server connect timeout (seconds)
server_connect_timeout = 5

; Server login retry delay (seconds)
server_login_retry = 3

; Client idle timeout (seconds) - disconnect idle clients
client_idle_timeout = 0

; Client login timeout (seconds)
client_login_timeout = 60

; ─── Query Settings ──────────────────────────────────────────────────────────
; Query timeout (seconds) - 0 = no timeout
query_timeout = 30

; Query wait timeout (seconds) - how long to wait for a server connection
query_wait_timeout = 120

; Cancel timeout (seconds)
cancel_timeout = 10

; ─── Logging ─────────────────────────────────────────────────────────────────
; Log connections
log_connections = 1

; Log disconnections
log_disconnections = 1

; Log pooler errors
log_pooler_errors = 1

; Stats period (seconds)
stats_period = 60

; Stats file
stats_file = /var/log/pgbouncer/pgbouncer_stats.log

; Verbose logging (0 = off, 1 = on)
verbose = 0

; ─── TCP Settings ────────────────────────────────────────────────────────────
; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6

; TCP user timeout (seconds)
tcp_user_timeout = 0

; ─── Security Settings ───────────────────────────────────────────────────────
; Disable admin commands from untrusted sources
admin_users = pgbouncer_admin

; Users allowed to use SHOW commands
stats_users = pgbouncer_stats

; ─── Dangerous Settings (disabled by default) ────────────────────────────────
; autodb_idle_timeout = 3600
; server_reset_query = 'DISCARD ALL'
; server_reset_query_always = 0

; ─── Performance Tuning ──────────────────────────────────────────────────────
; Disable DNS lookup for performance
dns_max_ttl = 15

; Maximum packet size
max_packet_size = 2147483647

; SO_REUSEADDR
so_reuseaddr = 1

; ─── TLS Settings (for production) ──────────────────────────────────────────
; client_tls_sslmode = prefer
; client_tls_key_file = /etc/pgbouncer/server.key
; client_tls_cert_file = /etc/pgbouncer/server.crt
; client_tls_ca_file = /etc/pgbouncer/ca.crt

; server_tls_sslmode = prefer
; server_tls_key_file = /etc/pgbouncer/client.key
; server_tls_cert_file = /etc/pgbouncer/client.crt
; server_tls_ca_file = /etc/pgbouncer/ca.crt
