apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: payment-orchestra
  labels:
    app: SERVICE_NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app: SERVICE_NAME
  template:
    metadata:
      labels:
        app: SERVICE_NAME
    spec:
      containers:
      - name: SERVICE_NAME
        image: ghcr.io/rayanmaya189-glitch/payment-orchestra/SERVICE_NAME:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: health
        env:
        - name: PLATFORM__SERVER__HOST
          value: "0.0.0.0"
        - name: PLATFORM__SERVER__PORT
          value: "8080"
        - name: PLATFORM__SERVER__HEALTH_PORT
          value: "8081"
        - name: PLATFORM__DATABASE__URL
          value: "postgres://postgres:changeme@postgresql:5432/platform"
        - name: PLATFORM__DATABASE__MAX_CONNECTIONS
          value: "10"
        - name: PLATFORM__DATABASE__MIN_CONNECTIONS
          value: "1"
        - name: PLATFORM__DATABASE__CONNECTION_TIMEOUT_SECS
          value: "5"
        - name: PLATFORM__DATABASE__MAX_LIFETIME_SECS
          value: "1800"
        - name: PLATFORM__REDIS__URL
          value: "redis://redis:6379"
        - name: PLATFORM__REDIS__MAX_CONNECTIONS
          value: "10"
        - name: PLATFORM__NATS__URL
          value: "nats://nats:4222"
        - name: PLATFORM__AUTH__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: jwt-secret
        - name: PLATFORM__AUTH__ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: encryption-key
        - name: PLATFORM__CORS__ALLOWED_ORIGINS
          value: "https://app.example.com"
        - name: PLATFORM__CORS__MAX_AGE_SECS
          value: "86400"
        - name: PLATFORM__RATE_LIMIT__LOGIN_PER_IP_PER_MINUTE
          value: "10"
        - name: PLATFORM__RATE_LIMIT__API_PER_PRINCIPAL_PER_SECOND
          value: "100"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: payment-orchestra
spec:
  selector:
    app: SERVICE_NAME
  ports:
  - port: 80
    targetPort: 8080
    name: http
  - port: 8081
    targetPort: 8081
    name: health
